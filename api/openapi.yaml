      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, email, provider_message_id]
              properties:
                event:
                  type: string
                  enum: [bounce, complaint, delivered]
                email:
                  type: string
                  format: email
                provider_message_id:
                  type: string
                reason:
                  type: string
                hard:
                  type: boolean
      responses:
        '200':
          description: Webhook processed
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'

components:
  responses:
    400Error:
      description: Validation Failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    401Error:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    403Error:
      description: Forbidden Role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    404Error:
      description: Resource Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    409Error:
      description: Invalid State Transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    429Error:
      description: Rate Limit Exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
