        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_key, to]
              properties:
                template_key:
                  type: string
                  example: auth.verify_email_otp
                to:
                  type: array
                  items:
                    type: string
                    format: email
                cc:
                  type: array
                  items:
                    type: string
                    format: email
                variables:
                  type: object
                sensitive_variables:
                  type: array
                  items:
                    type: string
                priority:
                  type: string
                  enum: [transactional, business]
                expires_at:
                  type: string
                  format: date-time
                attachments:
                  type: array
                  items:
                    type: object
